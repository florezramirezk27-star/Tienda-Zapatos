<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Registro')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container">
  <div class="card auth-card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h4 mb-3">Crear mi cuenta</h1>
      <form th:action="@{/registro}" th:object="${form}" method="post" novalidate>
        <div class="mb-3">
          <label class="form-label" for="nombre">Nombre</label>
          <input class="form-control" th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'"
                 type="text" id="nombre" th:field="*{nombre}">
          <div class="invalid-feedback" th:errors="*{nombre}"></div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="correo">Correo</label>
          <input class="form-control" th:classappend="${#fields.hasErrors('correo')} ? 'is-invalid'"
                 type="email" id="correo" th:field="*{correo}">
          <div class="invalid-feedback" th:errors="*{correo}"></div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="telefono">Teléfono</label>
          <input class="form-control" th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid'"
                 type="tel" id="telefono" th:field="*{telefono}">
          <div class="invalid-feedback" th:errors="*{telefono}"></div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Contraseña</label>
          <input class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                 type="password" id="password" name="password">
          <div class="form-text">Mínimo 8 caracteres, con letras y números.</div>
          <div class="invalid-feedback" th:errors="*{password}"></div>
        </div>
        <button class="btn btn-dark w-100" type="submit">Registrarme</button>
      </form>
      <p class="text-center mt-3 mb-0 small">¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a></p>
    </div>
  </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
