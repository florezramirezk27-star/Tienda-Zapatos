<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Crear cuenta')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="auth-page" aria-labelledby="registro-title">
  <div class="auth-card">
    <header class="auth-header">
      <a class="auth-logo" th:href="@{/}" aria-label="STEP - Inicio">
        <span aria-hidden="true">👟</span> STEP
      </a>
      <h1 id="registro-title" class="auth-title">Crear mi cuenta</h1>
      <p class="auth-subtitle">Únete a STEP y disfruta de beneficios exclusivos</p>
    </header>

    <div th:replace="~{fragments/layout :: alertas}"></div>

    <form class="auth-form" th:action="@{/registro}" th:object="${form}" method="post" novalidate>
      <div class="mb-3">
        <label class="form-label" for="nombre">Nombre completo</label>
        <input class="form-control" th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'"
               type="text" id="nombre" th:field="*{nombre}" required
               placeholder="Juan Pérez" autocomplete="name">
        <div class="invalid-feedback" th:errors="*{nombre}"></div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="correo">Correo electrónico</label>
        <input class="form-control" th:classappend="${#fields.hasErrors('correo')} ? 'is-invalid'"
               type="email" id="correo" th:field="*{correo}" required
               placeholder="tu@email.com" autocomplete="email">
        <div class="invalid-feedback" th:errors="*{correo}"></div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="telefono">Teléfono</label>
        <input class="form-control" th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid'"
               type="tel" id="telefono" th:field="*{telefono}" required
               placeholder="+57 300 123 4567" autocomplete="tel">
        <div class="invalid-feedback" th:errors="*{telefono}"></div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="password">Contraseña</label>
        <input class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
               type="password" id="password" name="password" required
               placeholder="••••••••" autocomplete="new-password"
               minlength="8" pattern="(?=.*[A-Za-z])(?=.*\d).{8,}">
        <div class="form-text">Mínimo 8 caracteres, con al menos una letra y un número.</div>
        <div class="invalid-feedback" th:errors="*{password}"></div>
      </div>

      <button class="btn btn-brand" type="submit">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="me-1">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        Crear mi cuenta
      </button>
    </form>

    <footer class="auth-footer">
      <p class="mb-0">¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a></p>
    </footer>
  </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
