<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Reporte de ventas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container py-4">
  <div th:replace="~{fragments/layout :: alertas}"></div>
  <h1 class="h3 mb-3">Reporte de ventas</h1>

  <form class="card card-body shadow-sm" style="max-width: 560px" method="get" th:action="@{/reportes/ventas/pdf}">
    <p class="small text-muted">El reporte cuenta los pedidos confirmados, enviados y entregados del rango. Los pendientes y cancelados no se incluyen.</p>
    <div class="row g-3">
      <div class="col-sm-6">
        <label class="form-label" for="desde">Desde</label>
        <input class="form-control" type="date" id="desde" name="desde" th:value="${desde}" required>
      </div>
      <div class="col-sm-6">
        <label class="form-label" for="hasta">Hasta</label>
        <input class="form-control" type="date" id="hasta" name="hasta" th:value="${hasta}" required>
      </div>
    </div>
    <div class="mt-3">
      <button class="btn btn-dark" type="submit">Generar PDF</button>
    </div>
  </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
