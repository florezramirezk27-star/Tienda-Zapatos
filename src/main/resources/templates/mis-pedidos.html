<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Mis pedidos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="orders-page">
  <div class="container">
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <header class="mb-5">
      <h1 class="display-title" style="font-size: var(--fs-h1); font-weight: 800;">Mis pedidos</h1>
      <p class="text-muted" style="font-size: var(--fs-body-lg);">Historial y estado de tus compras</p>
    </header>

    <!-- SIN PEDIDOS -->
    <div class="orders-empty" th:if="${#lists.isEmpty(pedidos)}" role="status">
      <div class="cart-empty-icon" aria-hidden="true">📦</div>
      <h2 class="cart-empty-title">Aún no tienes pedidos</h2>
      <p class="cart-empty-text">Cuando realices tu primera compra, aparecerá aquí con su estado y detalles.</p>
      <a class="btn btn-brand btn-lg" th:href="@{/catalogo}">Explorar catálogo</a>
    </div>

    <!-- LISTA DE PEDIDOS -->
    <div class="orders-table" th:unless="${#lists.isEmpty(pedidos)}">
      <table class="table mb-0" role="grid" aria-label="Lista de pedidos">
        <thead>
          <tr>
            <th scope="col">Pedido</th>
            <th scope="col">Fecha</th>
            <th scope="col">Estado</th>
            <th scope="col" class="text-center">Items</th>
            <th scope="col" class="text-end">Total</th>
            <th scope="col"></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="p : ${pedidos}">
            <td>
              <span class="order-number" th:text="${p.numero}">PED-0001</span>
            </td>
            <td class="order-date" th:text="${#temporals.format(p.fecha, 'dd/MM/yyyy HH:mm')}">fecha</td>
            <td>
              <span th:replace="~{fragments/layout :: estado(${p.estado})}"></span>
            </td>
            <td class="text-center">
              <span class="fw-semibold" style="font-family: var(--font-display);" th:text="${p.unidades}">1</span>
            </td>
            <td class="text-end order-total" th:text="${@dinero.formato(p.total)}">$0</td>
            <td class="text-end">
              <a class="btn btn-outline-blue btn-sm" th:href="@{/mis-pedidos/{id}(id=${p.id})}">Ver detalle</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
