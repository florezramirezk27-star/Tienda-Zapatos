<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Mis pedidos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container py-4">
  <div th:replace="~{fragments/layout :: alertas}"></div>
  <h1 class="h3 mb-3">Mis pedidos</h1>

  <div class="alert alert-info" th:if="${#lists.isEmpty(pedidos)}">
    Aún no tienes pedidos. <a th:href="@{/catalogo}">Ver el catálogo</a>
  </div>

  <div class="table-responsive" th:unless="${#lists.isEmpty(pedidos)}">
    <table class="table bg-white shadow-sm align-middle">
      <thead class="table-light">
        <tr><th>Número</th><th>Fecha</th><th>Estado</th><th class="text-center">Unidades</th><th class="text-end">Total</th><th></th></tr>
      </thead>
      <tbody>
        <tr th:each="p : ${pedidos}">
          <td th:text="${p.numero}">PED-0</td>
          <td th:text="${#temporals.format(p.fecha, 'dd/MM/yyyy HH:mm')}">fecha</td>
          <td><span th:replace="~{fragments/layout :: estado(${p.estado})}"></span></td>
          <td class="text-center" th:text="${p.unidades}">1</td>
          <td class="text-end" th:text="${@dinero.formato(p.total)}">$0</td>
          <td class="text-end"><a class="btn btn-outline-dark btn-sm" th:href="@{/mis-pedidos/{id}(id=${p.id})}">Ver detalle</a></td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
