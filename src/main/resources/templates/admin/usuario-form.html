<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Nuevo usuario')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container py-4">
  <div class="card auth-card shadow-sm" style="max-width: 520px">
    <div class="card-body p-4">
      <h1 class="h4 mb-3">Nuevo usuario</h1>
      <form th:action="@{/admin/usuarios}" th:object="${form}" method="post" novalidate>
        <div class="mb-3">
          <label class="form-label" for="nombre">Nombre</label>
          <input class="form-control" th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'" type="text" id="nombre" th:field="*{nombre}">
          <div class="invalid-feedback" th:errors="*{nombre}"></div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="correo">Correo</label>
          <input class="form-control" th:classappend="${#fields.hasErrors('correo')} ? 'is-invalid'" type="email" id="correo" th:field="*{correo}">
          <div class="invalid-feedback" th:errors="*{correo}"></div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="telefono">Teléfono</label>
          <input class="form-control" th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid'" type="tel" id="telefono" th:field="*{telefono}">
          <div class="invalid-feedback" th:errors="*{telefono}"></div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Contraseña</label>
          <input class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" type="password" id="password" name="password">
          <div class="form-text">Mínimo 8 caracteres, con letras y números.</div>
          <div class="invalid-feedback" th:errors="*{password}"></div>
        </div>
        <div class="mb-3">
          <!-- REQ-ZAP-007: exactamente uno de los 5 roles -->
          <label class="form-label" for="rol">Rol</label>
          <select class="form-select" th:classappend="${#fields.hasErrors('rol')} ? 'is-invalid'" id="rol" name="rol">
            <option value="">Selecciona un rol</option>
            <option th:each="r : ${roles}" th:value="${r}" th:text="${r.etiqueta}" th:selected="${r == form.rol}"></option>
          </select>
          <div class="invalid-feedback" th:errors="*{rol}"></div>
        </div>
        <button class="btn btn-dark" type="submit">Crear usuario</button>
        <a class="btn btn-link" th:href="@{/admin/usuarios}">Cancelar</a>
      </form>
    </div>
  </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
