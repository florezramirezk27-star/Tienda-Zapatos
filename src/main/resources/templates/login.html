<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="auth-page" id="main-content">
  <div class="container">
    <div class="auth-shell">
      <aside class="auth-visual" aria-hidden="true">
        <img th:src="@{/img/hero.jpg}" alt="" loading="lazy">
        <div class="auth-visual-content">
          <p class="eyebrow">Tu próxima talla</p>
          <h2>El par correcto te espera.</h2>
          <p>Consulta la disponibilidad por talla, guarda tu carrito y completa tu pedido en minutos.</p>
        </div>
      </aside>

      <div class="auth-panel">
        <div class="auth-card">
          <header class="auth-header">
            <a class="marca auth-logo" th:href="@{/}" aria-label="STEP Calzado - Inicio">
              <span class="marca-monograma" aria-hidden="true">S</span>
              <span class="marca-texto">STEP<small>calzado</small></span>
            </a>
            <h1 id="login-title" class="auth-title">Bienvenido de nuevo</h1>
            <p class="auth-subtitle">Inicia sesión para continuar tu compra.</p>
          </header>

          <div class="auth-alertas">
            <div class="alert alert-exito alert-dismissible fade show" role="alert" th:if="${mensaje}">
              <svg th:replace="~{fragments/iconos :: icono('check-circle', 'icon')}"></svg>
              <div th:text="${mensaje}"></div>
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
            </div>
            <div class="alert alert-error alert-dismissible fade show" role="alert" th:if="${error}">
              <svg th:replace="~{fragments/iconos :: icono('alert-circle', 'icon')}"></svg>
              <div th:text="${error}"></div>
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
            </div>
            <div class="alert alert-error" role="alert" th:if="${param.error}">
              <svg th:replace="~{fragments/iconos :: icono('alert-circle', 'icon')}"></svg>
              <div>Correo o contraseña incorrectos</div>
            </div>
          </div>

          <form class="auth-form" th:action="@{/login}" method="post" novalidate>
            <div class="mb-3">
              <label class="form-label" for="correo">Correo electrónico</label>
              <input class="form-control" type="email" id="correo" name="correo" required autofocus
                     placeholder="tu@email.com" autocomplete="email">
            </div>

            <div class="mb-3">
              <label class="form-label" for="password">Contraseña</label>
              <input class="form-control" type="password" id="password" name="password" required
                     placeholder="••••••••" autocomplete="current-password">
            </div>

            <button class="btn btn-brand btn-lg" type="submit">
              <svg th:replace="~{fragments/iconos :: icono('arrow-right', 'icon')}"></svg>
              Iniciar sesión
            </button>
          </form>

          <footer class="auth-footer">
            <p>¿No tienes cuenta? <a th:href="@{/registro}">Crear una ahora</a></p>
          </footer>
        </div>
      </div>
    </div>
  </div>
</main>

<footer th:replace="~{fragments/layout :: pie}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
