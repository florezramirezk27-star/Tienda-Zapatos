<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="auth-page" aria-labelledby="login-title">
  <div class="auth-card">
    <header class="auth-header">
      <a class="auth-logo" th:href="@{/}" aria-label="STEP - Inicio">
        <span aria-hidden="true">👟</span> STEP
      </a>
      <h1 id="login-title" class="auth-title">Bienvenido de nuevo</h1>
      <p class="auth-subtitle">Inicia sesión para continuar tu compra</p>
    </header>

    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div class="alert alert-danger" th:if="${param.error}" role="alert">
      Correo o contraseña incorrectos. Por favor, inténtalo de nuevo.
    </div>

    <form class="auth-form" th:action="@{/login}" method="post" novalidate>
      <div class="mb-3">
        <label class="form-label" for="correo">Correo electrónico</label>
        <input class="form-control" type="email" id="correo" name="correo" required autofocus
               placeholder="tu@email.com" autocomplete="email">
      </div>

      <div class="mb-3">
        <label class="form-label" for="password">Contraseña</label>
        <input class="form-control" type="password" id="password" name="password" required
               placeholder="••••••••" autocomplete="current-password">
      </div>

      <button class="btn btn-brand" type="submit">
        Iniciar sesión
      </button>
    </form>

    <footer class="auth-footer">
      <p class="mb-0">¿No tienes cuenta? <a th:href="@{/registro}">Crear una ahora</a></p>
    </footer>
  </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
