<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container">
  <div class="card auth-card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h4 mb-3">Iniciar sesión</h1>
      <div th:replace="~{fragments/layout :: alertas}"></div>
      <!-- REQ-ZAP-002: el mismo mensaje para cualquier fallo, sin decir qué dato estaba mal -->
      <div class="alert alert-danger" th:if="${param.error}">Correo o contraseña incorrectos</div>
      <form th:action="@{/login}" method="post">
        <div class="mb-3">
          <label class="form-label" for="correo">Correo</label>
          <input class="form-control" type="email" id="correo" name="correo" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Contraseña</label>
          <input class="form-control" type="password" id="password" name="password" required>
        </div>
        <button class="btn btn-dark w-100" type="submit">Ingresar</button>
      </form>
      <p class="text-center mt-3 mb-0 small">¿No tienes cuenta? <a th:href="@{/registro}">Regístrate</a></p>
    </div>
  </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
