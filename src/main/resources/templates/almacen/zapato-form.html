<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Zapato')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="page-shell" id="main-content">
  <div class="container">
    <a class="enlace-volver mb-4" th:href="@{/almacen/zapatos}">
      <svg th:replace="~{fragments/iconos :: icono('arrow-left', 'icon-sm')}"></svg>
      Volver a zapatos
    </a>

    <header class="page-head">
      <div>
        <p class="eyebrow">Almacén</p>
        <h1 th:text="${zapatoId == null} ? 'Nuevo zapato' : 'Editar zapato'">Zapato</h1>
        <p>Completa los datos del producto. El stock se gestiona por talla desde el inventario.</p>
      </div>
    </header>

    <section class="panel" style="max-width: 760px;" aria-labelledby="form-zapato">
      <div class="panel-head">
        <h2 id="form-zapato">Datos del producto</h2>
      </div>
      <div class="panel-body">
        <form th:action="${zapatoId == null} ? @{/almacen/zapatos} : @{/almacen/zapatos/{id}(id=${zapatoId})}"
              th:object="${form}" method="post" novalidate>
          <div class="mb-3">
            <label class="form-label" for="nombre">Nombre</label>
            <input class="form-control" th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'" type="text" id="nombre" th:field="*{nombre}">
            <div class="invalid-feedback" th:errors="*{nombre}"></div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label" for="marca">Marca</label>
              <input class="form-control" th:classappend="${#fields.hasErrors('marca')} ? 'is-invalid'" type="text" id="marca" th:field="*{marca}">
              <div class="invalid-feedback" th:errors="*{marca}"></div>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label" for="categoria">Categoría</label>
              <input class="form-control" th:classappend="${#fields.hasErrors('categoria')} ? 'is-invalid'" type="text" id="categoria" th:field="*{categoria}">
              <div class="invalid-feedback" th:errors="*{categoria}"></div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label" for="color">Color</label>
              <input class="form-control" th:classappend="${#fields.hasErrors('color')} ? 'is-invalid'" type="text" id="color" th:field="*{color}">
              <div class="invalid-feedback" th:errors="*{color}"></div>
            </div>
            <div class="col-md-6 mb-3">
              <!-- REQ-ZAP-012: el precio debe ser mayor que cero -->
              <label class="form-label" for="precio">Precio (COP, sin IVA)</label>
              <input class="form-control" th:classappend="${#fields.hasErrors('precio')} ? 'is-invalid'" type="number" step="any" id="precio" th:field="*{precio}">
              <div class="invalid-feedback" th:errors="*{precio}"></div>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="imagen">URL de la imagen (opcional)</label>
            <input class="form-control" th:classappend="${#fields.hasErrors('imagen')} ? 'is-invalid'" type="url" id="imagen" th:field="*{imagen}" placeholder="https://...">
            <div class="form-text">Si se deja vacía, se usará una imagen de referencia de la categoría.</div>
            <div class="invalid-feedback" th:errors="*{imagen}"></div>
          </div>

          <div class="mb-4">
            <label class="form-label" for="descripcion">Descripción (opcional)</label>
            <textarea class="form-control" th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid'" id="descripcion" rows="3" th:field="*{descripcion}"></textarea>
            <div class="invalid-feedback" th:errors="*{descripcion}"></div>
          </div>

          <div class="d-flex flex-wrap gap-2">
            <button class="btn btn-brand" type="submit">
              <svg th:replace="~{fragments/iconos :: icono('check', 'icon')}"></svg>
              Guardar
            </button>
            <a class="btn btn-outline" th:href="@{/almacen/zapatos}">Cancelar</a>
          </div>
        </form>
      </div>
    </section>
  </div>
</main>

<footer th:replace="~{fragments/layout :: pie}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
