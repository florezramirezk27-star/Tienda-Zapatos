<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Acceso denegado')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="error-page" id="main-content" aria-labelledby="error-title">
  <div class="error-content">
    <div class="error-icon" aria-hidden="true">
      <svg th:replace="~{fragments/iconos :: icono('lock', 'icon')}"></svg>
    </div>
    <div class="error-code">403</div>
    <h1 id="error-title" class="error-title">Acceso denegado</h1>
    <p class="error-text">No tienes permisos para ver esta página. Si crees que es un error, inicia sesión con una cuenta que tenga los permisos necesarios.</p>
    <div class="error-actions">
      <a class="btn btn-brand btn-lg" th:href="@{/}">
        <svg th:replace="~{fragments/iconos :: icono('house', 'icon')}"></svg>
        Volver al inicio
      </a>
      <a class="btn btn-outline btn-lg" th:href="@{/login}">Iniciar sesión</a>
    </div>
  </div>
</main>

<footer th:replace="~{fragments/layout :: pie}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
