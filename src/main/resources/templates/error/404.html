<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Página no encontrada')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="error-page" role="main" aria-labelledby="error-title">
  <div class="error-content">
    <div class="error-code" aria-hidden="true">404</div>
    <h1 id="error-title" class="error-title">Página no encontrada</h1>
    <p class="error-text">Lo sentimos, la página que buscas no existe o ha sido movida. Puede que la URL esté mal escrita o que el producto ya no esté disponible.</p>
    <div class="error-actions">
      <a class="btn btn-brand btn-lg" th:href="@{/}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="me-1">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Volver al inicio
      </a>
      <a class="btn btn-outline-blue btn-lg" th:href="@{/catalogo}">Ver catálogo</a>
    </div>
  </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
