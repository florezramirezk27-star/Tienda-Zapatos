<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error del servidor')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="error-page" id="main-content" aria-labelledby="error-title">
  <div class="error-content">
    <div class="error-icon" aria-hidden="true">
      <svg th:replace="~{fragments/iconos :: icono('alert-triangle', 'icon')}"></svg>
    </div>
    <div class="error-code">500</div>
    <h1 id="error-title" class="error-title">Error del servidor</h1>
    <p class="error-text">Algo salió mal de nuestro lado. Inténtalo de nuevo en unos minutos. Si el problema continúa, vuelve al catálogo para seguir explorando.</p>
    <div class="error-actions">
      <a class="btn btn-brand btn-lg" th:href="@{/}">
        <svg th:replace="~{fragments/iconos :: icono('house', 'icon')}"></svg>
        Volver al inicio
      </a>
      <button class="btn btn-outline btn-lg" type="button" onclick="window.location.reload()">
        <svg th:replace="~{fragments/iconos :: icono('refresh', 'icon')}"></svg>
        Reintentar
      </button>
    </div>
  </div>
</main>

<footer th:replace="~{fragments/layout :: pie}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
