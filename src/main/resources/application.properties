spring.application.name=tienda-zapatos
server.port=8080
server.servlet.session.timeout=60m
server.error.include-message=never

# ---- PostgreSQL (ADR-006; sustituye a MySQL 8 del DOCX original) ----
# Credenciales por variables de entorno; no se guardan claves en el repositorio (NFR-005).
spring.datasource.url=jdbc:postgresql://localhost:5432/tienda_zapatos?stringtype=unspecified
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- HikariCP ----
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=TiendaZapatosPool
spring.datasource.hikari.connection-test-query=SELECT 1

# ---- JPA PostgreSQL: el esquema se crea con database/tienda_zapatos.sql y se valida al arrancar ----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# ---- Vistas ----
spring.thymeleaf.cache=false
spring.web.locale=es_CO

# ---- Datos de demostración ----
tienda.datos-demo=true