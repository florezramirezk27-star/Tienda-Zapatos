spring.application.name=tienda-zapatos
server.port=8080
server.servlet.session.timeout=60m
server.error.include-message=never

# ---- MySQL (ADR-003). Cambia usuario y clave con variables de entorno DB_USER y DB_PASSWORD ----
spring.datasource.url=jdbc:mysql://localhost:3306/tienda_zapatos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# ---- HikariCP (límite 5 conexiones en Clever Cloud Free) ----
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=TiendaZapatosPool

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# ---- Vistas ----
spring.thymeleaf.cache=false
spring.web.locale=es_CO

# ---- Datos de demostración (usuarios de los 5 roles y zapatos de ejemplo) ----
# Ponlo en false cuando vayas a usar datos reales.
tienda.datos-demo=true
