# Las pruebas usan una base MySQL aparte (tienda_zapatos_test) para no tocar los datos reales.
spring.datasource.url=jdbc:mysql://localhost:3306/tienda_zapatos_test?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=create-drop
spring.thymeleaf.cache=false
tienda.datos-demo=false
